services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veta-site
    restart: unless-stopped
    ports:
      # Слушаем только на localhost — снаружи будет nginx хоста с SSL
      - "127.0.0.1:8080:80"
    depends_on:
      - decap-oauth
    networks:
      - web

  decap-oauth:
    build:
      context: ./docker/oauth-proxy
      dockerfile: Dockerfile
    container_name: veta-oauth
    restart: unless-stopped
    ports:
        - "127.0.0.1:3001:3000"
    environment:
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - ORIGIN=https://${DOMAIN}
      - PORT=3000
    networks:
      - web

networks:
  web:
    driver: bridge
