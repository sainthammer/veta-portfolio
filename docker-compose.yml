services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veta-site
    restart: unless-stopped
    ports:
      # Слушаем только на localhost — снаружи будет nginx хоста с SSL
      - "127.0.0.1:8080:80"
    depends_on:
      - decap-oauth
    networks:
      - web

  decap-oauth:
    image: vencax/netlify-cms-github-oauth-provider
    container_name: veta-oauth
    restart: unless-stopped
    environment:
      # Создайте OAuth App на GitHub: https://github.com/settings/developers
      # Authorization callback URL: https://YOUR_DOMAIN.com/callback
      - ORIGINS=https://${DOMAIN}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - GIT_HOSTNAME=https://github.com
    networks:
      - web

networks:
  web:
    driver: bridge
