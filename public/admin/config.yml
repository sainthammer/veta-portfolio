backend:
  name: github
  repo: sainthammer/veta-portfolio # <-- замени на свой
  branch: main
  base_url: https://vetasergeeva.ru    # <-- замени на свой домен
  auth_endpoint: /auth

# Редирект после OAuth
site_url: https://vetasergeeva.ru
display_url: https://vetasergeeva.ru
logo_url: /favicon.svg

# Локализация интерфейса
locale: ru

# Куда загружаются картинки из админки
media_folder: "src/assets/portfolio"
public_folder: "/src/assets/portfolio"

# Editorial workflow создаёт PR вместо прямого коммита — удобно для ревью
publish_mode: simple

collections:
  # ========== ПОРТФОЛИО ==========
  - name: "portfolio"
    label: "Портфолио"
    label_singular: "Работа"
    folder: "src/content/portfolio"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} — {{category}} · {{year}}"
    sortable_fields: ["order", "year", "title"]
    view_groups:
      - label: "Категория"
        field: category
    fields:
      - { label: "Название", name: "title", widget: "string" }
      - { label: "Клиент", name: "client", widget: "string", required: false }
      - label: "Категория"
        name: "category"
        widget: "select"
        options: ["Reels", "Stories", "SMM", "Branding"]
      - { label: "Год", name: "year", widget: "number", default: 2025, value_type: "int", min: 2020, max: 2030 }
      - { label: "Обложка", name: "cover", widget: "image" }
      - label: "Галерея (доп. картинки)"
        name: "gallery"
        widget: "list"
        required: false
        field: { label: "Изображение", name: "image", widget: "image" }
      - { label: "Описание (короткое)", name: "description", widget: "text", required: false }
      - label: "Теги"
        name: "tags"
        widget: "list"
        required: false
        default: []
      - { label: "Показать на главной (featured)", name: "featured", widget: "boolean", default: false }
      - { label: "Порядок сортировки", name: "order", widget: "number", default: 0, value_type: "int" }
      - { label: "Внешняя ссылка (опционально)", name: "externalUrl", widget: "string", required: false, pattern: ["^https?://", "Должна начинаться с http:// или https://"] }
      - { label: "Полное описание (Markdown)", name: "body", widget: "markdown", required: false }

  # ========== НАСТРОЙКИ САЙТА ==========
  - name: "settings"
    label: "Настройки сайта"
    files:
      - label: "Тексты на главной"
        name: "site"
        file: "src/data/site.json"
        format: "json"
        fields:
          - label: "Hero — первый экран"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Имя", name: "name", widget: "string" }
              - { label: "Слоган", name: "tagline", widget: "string", hint: "Разделяйте элементы символом ·" }
              - { label: "Описание", name: "intro", widget: "text" }
              - { label: "Статус доступности", name: "availability", widget: "string" }
              - { label: "Локация", name: "location", widget: "string" }
              - label: "Фото в Hero (до 3 штук)"
                name: "photos"
                widget: "list"
                max: 3
                hint: "Вертикальные фото 3:4 или 4:5, рекомендуемый размер от 900x1200px"
                fields:
                  - { label: "Фото", name: "src", widget: "image", media_folder: "/public/images", public_folder: "/images" }
                  - { label: "Alt-текст (для SEO и доступности)", name: "alt", widget: "string" }
                  - { label: "Подпись (появляется при hover)", name: "caption", widget: "string", required: false }

          - label: "About — о себе"
            name: "about"
            widget: "object"
            fields:
              - { label: "Заголовок", name: "headline", widget: "string" }
              - { label: "Текст", name: "body", widget: "text" }
              - { label: "Фото автора", name: "photo", widget: "image", hint: "Вертикальное фото 4:5, рекомендуемый размер ~1200x1500px", media_folder: "/public/images", public_folder: "/images" }
              - { label: "Подпись под фото", name: "photoCaption", widget: "string" }
              - label: "Хайлайты (список буллетов)"
                name: "highlights"
                widget: "list"
                required: false
                hint: "Короткие пункты — опыт, сертификаты, достижения"
              - label: "Статистика"
                name: "stats"
                widget: "list"
                fields:
                  - { label: "Значение", name: "value", widget: "string" }
                  - { label: "Подпись", name: "label", widget: "string" }

          - label: "Services — услуги"
            name: "services"
            widget: "list"
            fields:
              - { label: "Номер", name: "number", widget: "string" }
              - { label: "Название", name: "title", widget: "string" }
              - { label: "Описание", name: "description", widget: "text" }
              - label: "Что входит (буллеты)"
                name: "bullets"
                widget: "list"

          - label: "Contact — контакты"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Заголовок секции", name: "headline", widget: "string" }
              - { label: "Подзаголовок", name: "subline", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Telegram", name: "telegram", widget: "string" }
              - { label: "Instagram", name: "instagram", widget: "string" }
              - { label: "TikTok", name: "tiktok", widget: "string" }

          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Copyright", name: "copyright", widget: "string" }
