backend:
  name: github
  repo: sainthammer/veta-portfolio
  branch: main
  base_url: https://vetasergeeva.ru
  auth_endpoint: /auth

site_url: https://vetasergeeva.ru
display_url: https://vetasergeeva.ru
logo_url: /favicon.svg

locale: ru

media_folder: "src/assets/portfolio"
public_folder: "/src/assets/portfolio"

publish_mode: simple

collections:
  # ========== ПОРТФОЛИО ==========
  - name: "portfolio"
    label: "Портфолио"
    label_singular: "Работа"
    folder: "src/content/portfolio"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} — {{category}} · {{year}}"
    sortable_fields: ["order", "year", "title"]
    view_groups:
      - label: "Категория"
        field: category
    fields:
      - { label: "Название", name: "title", widget: "string" }
      - { label: "Клиент", name: "client", widget: "string", required: false }
      - label: "Категория"
        name: "category"
        widget: "select"
        options: ["Reels", "Stories", "SMM", "Branding"]
      - { label: "Год", name: "year", widget: "number", default: 2025, value_type: "int", min: 2020, max: 2030 }
      - label: "Обложка"
        name: "cover"
        widget: "image"
        media_folder: "/public/images"
        public_folder: "/images"
      - label: "Галерея (доп. изображения)"
        name: "gallery"
        widget: "list"
        required: false
        field:
          label: "Изображение"
          name: "image"
          widget: "image"
          media_folder: "/public/images"
          public_folder: "/images"
      - { label: "Короткое описание", name: "description", widget: "text", required: false }
      - label: "Теги"
        name: "tags"
        widget: "list"
        required: false
        default: []
        field: { label: "Тег", name: "tag", widget: "string" }
      - { label: "Показывать на главной", name: "featured", widget: "boolean", default: false }
      - { label: "Порядок сортировки", name: "order", widget: "number", default: 0, value_type: "int" }
      - { label: "Внешняя ссылка", name: "externalUrl", widget: "string", required: false, pattern: ["^https?://", "Должна начинаться с http:// или https://"] }
      - label: "Описание проекта (Markdown)"
        name: "body"
        widget: "markdown"
        required: false
        hint: |
          Поддерживает кастомные блоки:
          ::: result
          Текст результата (тёмный блок)
          :::
          ::: insight
          Инсайт или вывод (серый с акцентом)
          :::
          ::: quote
          Цитата клиента
          :::
          ::: stat
          +240% охват
          :::
          ::: note
          Заметка или дополнение
          :::

  # ========== НАСТРОЙКИ САЙТА ==========
  # Все секции — один файл, одна запись. Иначе GitHub API выдаёт
  # "Paths must be unique across additions and deletions".
  - name: "settings"
    label: "Настройки сайта"
    files:
      - label: "Настройки сайта"
        name: "site"
        file: "src/data/site.json"
        format: "json"
        fields:

          # ---------- HERO ----------
          - label: "Hero — главный экран"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Слоган (через · )", name: "tagline", widget: "string", hint: "Разделяйте элементы символом ·, например: Stories · Reels · SMM" }
              - { label: "Введение", name: "intro", widget: "text" }
#              - { label: "Статус доступности", name: "availability", widget: "string", hint: "Напр.: Доступна для проектов — Q3 2025" }
#              - { label: "Локация", name: "location", widget: "string" }
#              - label: "Фото в Hero (ровно 3)"
#                name: "photos"
#                widget: "list"
#                max: 3
#                hint: "Вертикальные фото 3:4 или 4:5, от 900×1200 px. Ровно 3 штуки — под них сверстан макет."
#                fields:
#                  - { label: "Фото", name: "src", widget: "image", media_folder: "/public/images", public_folder: "/images" }
#                  - { label: "Alt-текст", name: "alt", widget: "string" }
#                  - { label: "Подпись (при наведении)", name: "caption", widget: "string", required: false }
              - label: "Фото для бегущей строки (Showcase)"
                name: "showcasePhotos"
                widget: "list"
                required: false
                hint: "Любое количество фото. Если список пустой — используются фото из Hero."
                fields:
                  - { label: "Фото", name: "src", widget: "image", media_folder: "/public/images", public_folder: "/images" }
                  - { label: "Alt-текст", name: "alt", widget: "string" }
                  - { label: "Подпись", name: "caption", widget: "string", required: false }

          # ---------- WORK ----------
          - label: "Selected Work — заголовок секции"
            name: "work"
            widget: "object"
            fields:
              - { label: "Заголовок", name: "headline", widget: "string" }
              - { label: "Подзаголовок", name: "subtitle", widget: "string" }

          # ---------- ABOUT ----------
          - label: "About — о себе"
            name: "about"
            widget: "object"
            fields:
              - { label: "Заголовок", name: "headline", widget: "string" }
              - { label: "Подзаголовок", name: "subtitle", widget: "string" }
              - { label: "Текст", name: "body", widget: "text" }
              - { label: "Фото автора", name: "photo", widget: "image", hint: "Вертикальное 4:5, от 1200×1500 px", media_folder: "/public/images", public_folder: "/images" }
              - { label: "Подпись под фото", name: "photoCaption", widget: "string" }
              - label: "Хайлайты"
                name: "highlights"
                widget: "list"
                required: false
                hint: "Короткие пункты — опыт, сертификаты, достижения"
                field: { label: "Пункт", name: "item", widget: "string" }
              - label: "Статистика"
                name: "stats"
                widget: "list"
                fields:
                  - { label: "Значение", name: "value", widget: "string" }
                  - { label: "Подпись", name: "label", widget: "string" }

          # ---------- SERVICES ----------
          - label: "Services — услуги"
            name: "services"
            widget: "object"
            fields:
              - { label: "Заголовок", name: "headline", widget: "string" }
              - { label: "Подзаголовок", name: "subtitle", widget: "string" }
              - label: "Список услуг"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Номер (01, 02...)", name: "number", widget: "string" }
                  - { label: "Название", name: "title", widget: "string" }
                  - { label: "Описание", name: "description", widget: "text" }
                  - label: "Что входит"
                    name: "bullets"
                    widget: "list"
                    field: { label: "Пункт", name: "item", widget: "string" }

          # ---------- CONTACT ----------
          - label: "Contact — контакты"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Заголовок секции", name: "headline", widget: "string" }
              - { label: "Подзаголовок", name: "subline", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Telegram", name: "telegram", widget: "string", hint: "Начиная с @" }
              - { label: "Instagram", name: "instagram", widget: "string", hint: "Начиная с @" }
              - { label: "TikTok", name: "tiktok", widget: "string", hint: "Начиная с @" }

          # ---------- FOOTER ----------
          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Copyright", name: "copyright", widget: "string" }
